version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: athleteiq-db
    environment:
      POSTGRES_DB: athleteiq
      POSTGRES_USER: athleteiq
      POSTGRES_PASSWORD: athleteiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athleteiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: athleteiq-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: athleteiq-api
    environment:
      ATHLETEIQ_DATABASE_URL: postgresql+asyncpg://athleteiq:athleteiq@db:5432/athleteiq
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-this-to-a-random-secret-key
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: athleteiq-web
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
